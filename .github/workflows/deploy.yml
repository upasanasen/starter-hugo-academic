name: Build and deploy site
on: {push: {branches: [main]}, workflow_dispatch: {}}
jobs: {build-deploy: {runs-on: ubuntu-latest, steps: [{name: Checkout, uses: "actions/checkout@v4"}, {name: Setup Hugo, uses: "peaceiris/actions-hugo@v2", with: {hugo-version: "0.111.3", extended: true}}, {name: Setup Go, uses: "actions/setup-go@v5", with: {go-version: "1.21"}}, {name: Build, run: hugo --gc --minify}, {name: Deploy to upasanasen.github.io, uses: "peaceiris/actions-gh-pages@v3", with: {personal_token: "${{ secrets.DEPLOY_TOKEN }}", external_repository: upasanasen/upasanasen.github.io, publish_branch: main, publish_dir: ./public}}]}}
